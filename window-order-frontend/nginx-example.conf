
# 这是一个 Nginx 配置示例，用于部署前端项目
# 请将以下 server 块的内容复制到你的 nginx.conf 文件的 http 块中
# 或者直接在 nginx.conf 中 include 此文件（如果有 include 机制）

server {
    listen       80;
    server_name  localhost;

    # 前端项目构建后的 dist 目录绝对路径
    # 请根据实际情况修改路径，注意 Windows 下路径分隔符使用正斜杠 /
    root   D:/work/javaspace/window-order-system-git/window-order-frontend/dist;
    
    # 默认首页
    index  index.html;

    # 开启 gzip 压缩（可选，提高加载速度）
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json;

    # 处理单页应用 (SPA) 的路由刷新 404 问题
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端接口
    # 将 /api 开头的请求转发到后端服务
    location /api/ {
        # 后端服务地址，请根据实际情况修改
        proxy_pass http://localhost:18080;
        
        # 设置请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 支持 WebSocket (如果后端有 WebSocket 功能)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 静态资源缓存设置（可选）
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires      30d;
    }

    location ~ .*\.(js|css)?$ {
        expires      12h;
    }
}
