server:
  port: 18080

spring:
  config:
    import: "optional:nacos:window-order-gateway.yaml"
  application:
    name: window-order-gateway
  codec:
    max-in-memory-size: 10GB
  data:
    redis:
      host: 192.168.97.243
      port: 6379
      password: d6c0b13e7cb5
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: 10.100.106.134:8848
        namespace: dev123456
      config:
        server-addr: 10.100.106.134:8848
        namespace: dev123456
        file-extension: yaml
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://window-order-auth
          predicates:
            - Path=/api/auth/**, /api/role/**, /api/roles/**, /api/logs/**, /api/file/**
          filters:
            - name: RequestSize
              args:
                maxSize: 10737418240

        - id: brand-service
          uri: lb://window-order-brand
          predicates:
            - Path=/api/brand/**, /api/product/**, /api/product/category/**

        - id: customer-service
          uri: lb://window-order-customer
          predicates:
            - Path=/api/customer/**

        - id: order-service
          uri: lb://window-order-order
          predicates:
            - Path=/api/order/**, /api/payment/**, /api/remeasure/**, /api/after-sales/**, /api/sales-target/**, /api/dashboard/**, /api/export-task/**, /api/inventory/**

window:
  cache:
    ttl-seconds: 600

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
